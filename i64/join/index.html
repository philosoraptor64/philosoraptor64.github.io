<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Join on i64</title>
<style>
  :root { --bg: #f6f6f8; --fg: #1c1c1e; --muted: #6b6b70; --accent: #e5322d; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f2f2f7; --muted: #9a9aa0; --card: #1c1c1e; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border-radius: 18px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 28px; margin: 0 0 8px; }
  .room { font: 700 40px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 4px; margin: 12px 0 20px; }
  a.button { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none;
             font-weight: 600; padding: 14px; border-radius: 12px; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>You're invited</h1>
    <p id="who">Join the room in i64:</p>
    <div class="room" id="room"></div>
    <a class="button" id="open" href="#">Open in i64</a>
    <p>Nothing happens? Install i64 first, then tap the button again.</p>
  </div>
</main>
<script>
  // The invite's details are in the part after '#', which browsers never send
  // to a web server: this page only hands them to the i64 app.
  (function () {
    var params = new URLSearchParams(location.hash.slice(1));
    var room = (params.get("r") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    var app = "i64://join?" + params.toString();
    document.getElementById("room").textContent = room || "?";
    var from = params.get("n");
    if (from) document.getElementById("who").textContent = from + " invited you to their room in i64:";
    var open = document.getElementById("open");
    open.href = app;
    if (room) setTimeout(function () { location.href = app; }, 300);
  })();
</script>
</body>
</html>
